name: Build DMG

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dmg:
    name: Build macOS disk image
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app
        run: make app

      - name: Create DMG staging folder
        run: |
          set -euo pipefail
          mkdir -p dist/dmg-root
          cp -R .build/release/NotSleep.app dist/dmg-root/
          ln -s /Applications dist/dmg-root/Applications

      - name: Create DMG
        run: |
          set -euo pipefail
          hdiutil create \
            -volname "NotSleep" \
            -srcfolder dist/dmg-root \
            -ov \
            -format UDZO \
            dist/NotSleep.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotSleep-dmg
          path: dist/NotSleep.dmg
          if-no-files-found: error

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            dist/NotSleep.dmg \
            --title "NotSleep ${GITHUB_REF_NAME}" \
            --notes "Release build for ${GITHUB_REF_NAME}."
